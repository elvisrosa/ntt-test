spring.application.name=microservice-customer
spring.webflux.base-path=/micro-customer

# ============================================================
# R2DBC Configuration (PostgreSQL)
# ============================================================
spring.r2dbc.url=r2dbc:postgresql://localhost:5435/testbank
spring.r2dbc.username=bankadmin
spring.r2dbc.password=SecureBank@2026!

# ============================================================
# Connection Pool Configuration
# ============================================================
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-acquire-time=3s
spring.r2dbc.pool.validation-query=SELECT 1

# ============================================================
# Server Configuration
# ============================================================
server.port=8080

# ============================================================
# Logging Configuration
# ============================================================
logging.level.root=INFO
logging.level.nttdata.test.microservice_customer=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.io.r2dbc=DEBUG

# ============================================================
# SpringDoc OpenAPI Configuration
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Usar el archivo YAML como fuente
springdoc.swagger-ui.urls[0].name=Customer API
springdoc.swagger-ui.urls[0].url=/openapi/openapi.yaml

springdoc.show-actuator=false

# ============================================================
# Banking Service Configuration
# ============================================================
banking.service.url=http://localhost:8081/micro-banking/api/v1

# ============================================================
# Spring Resources (para servir archivos estáticos)
# ============================================================
spring.web.resources.static-locations=classpath:/static/