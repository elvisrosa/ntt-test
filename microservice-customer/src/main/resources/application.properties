spring.application.name=microservice-customer

# ============================================================
# R2DBC Configuration (PostgreSQL)
# ============================================================
spring.r2dbc.url=r2dbc:postgresql://localhost:5435/testbank
spring.r2dbc.username=bankadmin
spring.r2dbc.password=SecureBank@2026!
spring.r2dbc.driver-class-name=org.postgresql.Driver

# ============================================================
# Connection Pool Configuration
# ============================================================
# Initial pool size
spring.r2dbc.pool.initial-size=5

# Maximum pool size
spring.r2dbc.pool.max-size=20

# Maximum idle time for connections (30 minutes)
spring.r2dbc.pool.max-idle-time=30m

# Max acquire time for a connection
spring.r2dbc.pool.max-acquire-time=3s

# Connection validation query
spring.r2dbc.pool.validation-query=SELECT 1

# ============================================================
# WebFlux Configuration
# ============================================================
spring.webflux.base-path=/micro-customer
server.port=8080

# ============================================================
# Logging Configuration
# ============================================================
logging.level.root=INFO
logging.level.nttdata.test.microservice_customer=DEBUG
logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.io.r2dbc=DEBUG

# Springdoc: point Swagger UI to the contract file (Contract-First / API-First)
# Point swagger-ui to the contract under the application base path
# The app uses `spring.webflux.base-path=/micro-customer`, so expose the
# contract at `/micro-customer/openapi.yaml` so the UI can load it correctly.
springdoc.swagger-ui.url=/micro-customer/openapi.yaml
# Expose Swagger UI under the WebFlux base path so UI is available at /micro-customer/swagger-ui/
springdoc.swagger-ui.path=/micro-customer/swagger-ui

# Banking service base URL (change to your banking service address)
banking.service.url=http://localhost:8081/micro-banking/api/v1
