version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: testbank
    environment:
      POSTGRES_DB: testbank
      POSTGRES_USER: bankadmin
      POSTGRES_PASSWORD: SecureBank@2026!
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/BaseDatos.sql:/docker-entrypoint-initdb.d/01-init-schema.sql
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankadmin -d testbank"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  banking-network:
    driver: bridge
